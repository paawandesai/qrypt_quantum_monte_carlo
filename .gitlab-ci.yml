# GitLab CI for the Qrypt Monte Carlo platform.
#
# Push path (interruptible, every job starts at once via needs: [], each job
# skips when its inputs did not change): ruff, mypy, unit tests + coverage gate, fail-closed seed grep,
# gitleaks, license audit, reproducible Lambda build, terraform fmt/validate,
# tflint, Checkov. Heavy lane (schedule or manual): browser smoke test.
# AWS jobs (plan/apply) use GitLab OIDC id_tokens; apply is manual and serialized.

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

stages: [check, build, iac, heavy, deploy]

default:
  interruptible: true
  timeout: 15m

variables:
  GIT_DEPTH: "20"
  HUSKY: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  CHECKPOINT_DISABLE: "1"
  TF_IN_AUTOMATION: "1"
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: "fast"
  ARTIFACT_COMPRESSION_LEVEL: "fast"
  GITLAB_PROJECT_ID: $CI_PROJECT_ID
  GITLAB_HOST: $CI_SERVER_HOST
  TF_STATE_NAME: dev
  # Per-job budget is 2 vCPU / 2 GiB. Go tools (terraform + its provider, tflint +
  # its plugin, gitleaks) run as up to two Go processes, so the ~1.5 GiB heap cap is
  # split between them. Python has no heap cap; its peaks are logged instead.
  GOMEMLIMIT: 750MiB
  # Wraps a job's heaviest step and prints wall time and peak RSS into the log.
  PEAK: python3 scripts/peak_mem.py --

# ---- change filters -------------------------------------------------------------
# On the default branch `changes` compares with the previous push; elsewhere
# with main, so a new branch does not run everything.
.py_paths: &py_paths [src/**/*, tests/**/*, eval/**/*, scripts/**/*, pyproject.toml, requirements-*.txt, requirements-dev.lock, .gitlab-ci.yml]
.tf_paths: &tf_paths [infra/**/*, .gitlab-ci.yml]
.dep_paths: &dep_paths [requirements-*.txt, requirements-dev.lock, .gitlab-ci.yml]
.build_paths: &build_paths [src/**/*, scripts/build.py, requirements-worker.txt, .gitlab-ci.yml]

.rules_py:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *py_paths
    - changes:
        paths: *py_paths
        compare_to: refs/heads/main

.rules_tf:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *tf_paths
    - changes:
        paths: *tf_paths
        compare_to: refs/heads/main

.rules_deps:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *dep_paths
    - changes:
        paths: *dep_paths
        compare_to: refs/heads/main

.rules_build:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $AWS_ROLE_ARN && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH # plan needs fresh zips
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *build_paths
    - changes:
        paths: *build_paths
        compare_to: refs/heads/main

.py_image:
  image: python:3.13-slim
  cache:
    key:
      files: [requirements-dev.lock]
    paths: [.cache/pip]
    policy: pull

# ---- check ------------------------------------------------------------------------

lint:
  extends: [.py_image, .rules_py]
  stage: check
  needs: []
  script:
    - pip install --quiet ruff==0.17.0
    - $PEAK ruff check src tests scripts eval
    - ruff format --check src tests scripts eval

typecheck:
  extends: [.py_image, .rules_py]
  stage: check
  needs: []
  script:
    - pip install --quiet mypy==2.4.0 numpy==2.5.4
    - $PEAK mypy

# Dependencies: the full dev venv is 316 MB, over this instance's artifact size
# limit (413 on upload), so jobs that need it re-install from the lockfile with
# a pip download cache keyed on the lockfile instead of passing .venv around.
unit-tests:
  extends: [.py_image, .rules_py]
  stage: check
  needs: []
  cache:
    key:
      files: [requirements-dev.lock]
    paths: [.cache/pip]
    policy: pull-push
  script:
    - python -m venv .venv && $PEAK .venv/bin/pip install --quiet -r requirements-dev.lock
    # 2 workers = the job's vCPU budget (about 40% faster than one, measured locally).
    - $PEAK .venv/bin/python -m pytest -p no:cacheprovider -n 2 --cov --cov-report=term --cov-report=xml --cov-fail-under=80
  coverage: '/TOTAL.*\s(\d+(?:\.\d+)?)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week

license-audit:
  extends: [.py_image, .rules_deps]
  stage: check
  needs: []
  script:
    - python -m venv .venv && .venv/bin/pip install --quiet -r requirements-dev.lock
    - .venv/bin/pip-licenses --from=mixed --format=markdown --with-urls --order=license > LICENSES.generated.md
    - .venv/bin/pip-licenses --from=mixed --fail-on="GNU General Public License (GPL);GNU Affero General Public License v3 (AGPLv3);GPL-3.0;AGPL-3.0"
  artifacts:
    paths: [LICENSES.generated.md]
    expire_in: 1 week

seed-path-grep:
  image: alpine:3.21
  extends: .rules_py
  stage: check
  needs: []
  before_script: [apk add --no-cache bash grep >/dev/null]
  script:
    - scripts/check_seed_path.sh

gitleaks:
  image:
    name: zricethezav/gitleaks:v8.28.0
    entrypoint: [""]
  stage: check
  needs: []
  variables:
    GIT_DEPTH: "0" # full history: a secret in any commit is a finding
  script:
    - gitleaks git --redact --no-banner -v .

# ---- build ------------------------------------------------------------------------

build:
  extends: [.py_image, .rules_build]
  stage: build
  needs: []
  cache:
    - key:
        files: [requirements-worker.txt]
      paths: [build/worker-deps]
  script:
    - $PEAK python scripts/build.py
    - sha256sum build/*.zip
  artifacts:
    paths: [build/api.zip, build/worker.zip, build/reconciler.zip]
    expire_in: 1 day

# ---- iac ------------------------------------------------------------------------

terraform-validate:
  image:
    name: hashicorp/terraform:1.16.6
    entrypoint: [""]
  extends: .rules_tf
  stage: iac
  needs: []
  cache:
    key:
      files: [infra/.terraform.lock.hcl]
    paths: [.cache/terraform-plugins]
  variables:
    TF_PLUGIN_CACHE_DIR: "$CI_PROJECT_DIR/.cache/terraform-plugins"
  script:
    - mkdir -p "$TF_PLUGIN_CACHE_DIR"
    # Peak memory for the Go binary via busybox time, when the image has it.
    - TIME=""; if busybox time -v true >/dev/null 2>&1; then TIME="busybox time -v"; fi
    - terraform -chdir=infra fmt -check -recursive
    - terraform -chdir=infra init -backend=false -input=false
    - $TIME terraform -chdir=infra validate
    - terraform -chdir=infra/bootstrap init -backend=false -input=false
    - terraform -chdir=infra/bootstrap validate

tflint:
  image:
    name: ghcr.io/terraform-linters/tflint:v0.59.1
    entrypoint: [""]
  extends: .rules_tf
  stage: iac
  needs: []
  script:
    - cd infra && tflint --init && tflint --recursive

checkov:
  image:
    name: bridgecrew/checkov:3.3.29
    entrypoint: [""]
  extends: .rules_tf
  stage: iac
  needs: []
  script:
    - $PEAK checkov -d infra --framework terraform --quiet --compact --skip-download

# ---- heavy lane (off the push path) ---------------------------------------------------

console-smoke:
  image: mcr.microsoft.com/playwright:v1.56.1-noble
  stage: heavy
  needs: []
  tags: [heavy]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  variables:
    NODE_OPTIONS: "--max-old-space-size=1536"
  script:
    - apt-get update -qq && apt-get install -y -qq python3-venv >/dev/null
    - python3 -m venv .venv-e2e && .venv-e2e/bin/pip install --quiet -r requirements-dev.lock
    - npm install --no-save --silent playwright@1.56.1
    - .venv-e2e/bin/python tests/e2e/local_server.py 8765 &
    - sleep 5
    - BASE_URL=http://127.0.0.1:8765 QMC_KEY=local-smoke-bearer .venv-e2e/bin/python scripts/peak_mem.py -- node tests/e2e/console_smoke.mjs

# ---- AWS (OIDC) -------------------------------------------------------------------

.aws:
  image:
    name: hashicorp/terraform:1.16.6
    entrypoint: [""]
  interruptible: false
  resource_group: aws-dev
  variables:
    # tf-init.sh exports these only inside its own process; plan/apply need them too.
    TF_HTTP_USERNAME: gitlab-ci-token
    TF_HTTP_PASSWORD: $CI_JOB_TOKEN
  id_tokens:
    AWS_ID_TOKEN:
      aud: sts.amazonaws.com
  before_script:
    - apk add --no-cache aws-cli bash curl >/dev/null
    - >
      export $(aws sts assume-role-with-web-identity
      --role-arn "$AWS_ROLE_ARN" --role-session-name "gitlab-$CI_PIPELINE_ID"
      --web-identity-token "$AWS_ID_TOKEN" --duration-seconds 3600
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text
      | awk '{print "AWS_ACCESS_KEY_ID="$1" AWS_SECRET_ACCESS_KEY="$2" AWS_SESSION_TOKEN="$3}')
    - scripts/tf-init.sh
    - TIME=""; if busybox time -v true >/dev/null 2>&1; then TIME="busybox time -v"; fi

plan:
  extends: .aws
  stage: deploy
  needs: [build]
  rules:
    - if: $AWS_ROLE_ARN && $ALARM_EMAIL && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    TF_VAR_alarm_email: $ALARM_EMAIL
  script:
    - $TIME terraform -chdir=infra plan -input=false -lock-timeout=60s -out=plan.tfplan
  artifacts:
    paths: [infra/plan.tfplan]
    expire_in: 1 day

apply:
  extends: .aws
  stage: deploy
  needs: [build, plan]
  rules:
    - if: $AWS_ROLE_ARN && $ALARM_EMAIL && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual # a person approves every apply
  variables:
    TF_VAR_alarm_email: $ALARM_EMAIL
  script:
    - terraform -chdir=infra apply -input=false -lock-timeout=60s plan.tfplan
