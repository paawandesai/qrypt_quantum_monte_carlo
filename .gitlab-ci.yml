# GitLab CI for the Qrypt Monte Carlo platform.
#
# Every push: lint, unit tests with coverage, the fail-closed seed-path grep,
# gitleaks, license audit, reproducible build, terraform fmt/validate, tflint
# and Checkov. AWS jobs (plan/apply) run only when AWS_ROLE_ARN is set and use
# GitLab OIDC id_tokens to assume an IAM role: no long-lived AWS keys in CI.
# apply is always manual.

stages: [check, build, iac, deploy]

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  CHECKPOINT_DISABLE: "1"
  TF_IN_AUTOMATION: "1"
  GITLAB_PROJECT_ID: $CI_PROJECT_ID
  GITLAB_HOST: $CI_SERVER_HOST
  TF_STATE_NAME: dev

.python:
  image: python:3.13-slim
  before_script:
    - pip install --quiet -r requirements-dev.lock

lint:
  extends: .python
  stage: check
  script:
    - ruff check src tests scripts
    - ruff format --check src tests scripts

unit-tests:
  extends: .python
  stage: check
  script:
    - python scripts/build.py
    - pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=80
  coverage: '/TOTAL.*\s(\d+(?:\.\d+)?)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

seed-path-grep:
  image: alpine:3.21
  stage: check
  before_script: [apk add --no-cache bash grep]
  script:
    - scripts/check_seed_path.sh

gitleaks:
  image:
    name: zricethezav/gitleaks:v8.28.0
    entrypoint: [""]
  stage: check
  variables:
    GIT_DEPTH: "0"
  script:
    - gitleaks git --redact --no-banner -v .

license-audit:
  extends: .python
  stage: check
  script:
    - pip-licenses --from=mixed --format=markdown --with-urls --order=license > LICENSES.generated.md
    - pip-licenses --from=mixed --fail-on="GNU General Public License (GPL);GNU Affero General Public License v3 (AGPLv3);GPL-3.0;AGPL-3.0"
  artifacts:
    paths: [LICENSES.generated.md]

build:
  extends: .python
  stage: build
  script:
    - python scripts/build.py
    - sha256sum build/*.zip
  artifacts:
    paths: [build/api.zip, build/worker.zip, build/reconciler.zip]
    expire_in: 7 days

terraform-validate:
  image:
    name: hashicorp/terraform:1.16.6
    entrypoint: [""]
  stage: iac
  script:
    - terraform -chdir=infra fmt -check -recursive
    - terraform -chdir=infra init -backend=false -input=false
    - terraform -chdir=infra validate

tflint:
  image:
    name: ghcr.io/terraform-linters/tflint:v0.59.1
    entrypoint: [""]
  stage: iac
  script:
    - cd infra && tflint --init && tflint --recursive

checkov:
  image:
    name: bridgecrew/checkov:3.3.29
    entrypoint: [""]
  stage: iac
  script:
    - checkov -d infra --framework terraform --quiet --compact --skip-download

# ---- AWS (OIDC) ---------------------------------------------------------------

.aws:
  image:
    name: hashicorp/terraform:1.16.6
    entrypoint: [""]
  id_tokens:
    AWS_ID_TOKEN:
      aud: sts.amazonaws.com
  needs: [build]
  before_script:
    - apk add --no-cache aws-cli bash curl
    - >
      export $(aws sts assume-role-with-web-identity
      --role-arn "$AWS_ROLE_ARN" --role-session-name "gitlab-$CI_PIPELINE_ID"
      --web-identity-token "$AWS_ID_TOKEN" --duration-seconds 3600
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text
      | awk '{print "AWS_ACCESS_KEY_ID="$1" AWS_SECRET_ACCESS_KEY="$2" AWS_SESSION_TOKEN="$3}')
    - scripts/tf-init.sh

plan:
  extends: .aws
  stage: deploy
  rules:
    - if: $AWS_ROLE_ARN && $ALARM_EMAIL
  variables:
    TF_VAR_alarm_email: $ALARM_EMAIL
  script:
    - terraform -chdir=infra plan -input=false -lock-timeout=60s -out=plan.tfplan
    # Plans can contain resource ARNs; keep them as short-lived artifacts only.
  artifacts:
    paths: [infra/plan.tfplan]
    expire_in: 1 day

apply:
  extends: .aws
  stage: deploy
  needs: [build, plan]
  rules:
    - if: $AWS_ROLE_ARN && $ALARM_EMAIL && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual # a person approves every apply
  variables:
    TF_VAR_alarm_email: $ALARM_EMAIL
  script:
    - terraform -chdir=infra apply -input=false -lock-timeout=60s plan.tfplan
